[project]
name = "my-trip-planner"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn>=0.53.0",
    "python-dotenv>=1.2.2",
    "pydantic-settings>=2.15.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-ollama>=0.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "greenlet>=3.0.0",
    "pyjwt>=2.14.0",
    "google-auth>=2.58.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# B008: FastAPI 的 Depends 在参数默认值中是标准惯用法（官方推荐写法）
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# 测试用本地日期构造用例更直观（DTZ011）
"tests/*.py" = ["DTZ011"]
